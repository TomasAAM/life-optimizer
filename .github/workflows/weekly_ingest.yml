name: Daily Ingestion & Dashboard

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9am UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

# Avoid overlapping deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Fitdays bridge
        run: npm ci --omit=dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Fitdays bridge tests
        run: npm test

      - name: Run ingestion
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Preferred body-composition source. Both credentials are required.
          FITDAYS_EMAIL: ${{ secrets.FITDAYS_EMAIL }}
          FITDAYS_PASSWORD: ${{ secrets.FITDAYS_PASSWORD }}
          FITDAYS_REGION: us
          # Optional fallback when the Fitdays cloud is unavailable.
          BODY_SHEET_CSV_URL: ${{ secrets.BODY_SHEET_CSV_URL }}
        run: python -m ingest.run

      - name: Build dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m dashboard.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
